name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install jq
      run: |
        apt-get update -qq && apt-get install -y jq || sudo apt-get update -qq && sudo apt-get install -y jq

    - name: Run test suite via Makefile
      run: make test
