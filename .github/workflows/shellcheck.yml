name: Shellcheck

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Install and run shellcheck to check all .sh files in the project
    - name: Install ShellCheck
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck

    - name: Run ShellCheck on all shell scripts
      run: |
        # Check all shell script files with appropriate severity level
        # Only fail on critical syntax errors, not style/warning/info messages
        find . -name "*.sh" -type f -not -path "./.git/*" -exec shellcheck -e SC2154,SC2148 --severity=error {} +